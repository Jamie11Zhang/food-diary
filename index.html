<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Diary 🍰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Gaegu:wght@400;700&family=Patrick+Hand&display=swap"
    rel="stylesheet"
  />
  <!-- Leaflet (free OpenStreetMap maps) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍰</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- soft floating doodles in the background -->
  <div class="doodles" aria-hidden="true">
    <span style="top:8%; left:5%;">☕</span>
    <span style="top:20%; right:7%;">🍰</span>
    <span style="top:55%; left:4%;">🍜</span>
    <span style="top:70%; right:6%;">🧁</span>
    <span style="top:40%; left:48%;">🍓</span>
    <span style="top:85%; left:30%;">🥐</span>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <div class="title-block">
        <h1>Food Diary</h1>
        <p class="subtitle">every meal we share, kept forever ♡</p>
        <span id="sync-badge" class="sync-badge" title="Set up Firebase in firebase-config.js to sync across devices">📱 this device only</span>
      </div>
      <button id="open-add" class="add-fab" title="Add a memory" aria-label="Add a memory">＋</button>
    </div>
  </header>

  <main>
    <!-- ============ GALLERY (main page) ============ -->
    <section id="gallery">
      <div class="gallery-controls">
        <input type="search" id="search" placeholder="🔍 search places, dishes, notes..." />
        <select id="filter-type">
          <option value="">All types</option>
          <option value="🍽️ Restaurant">🍽️ Restaurant</option>
          <option value="☕ Café">☕ Café</option>
          <option value="🧁 Dessert shop">🧁 Dessert shop</option>
          <option value="🍕 Fast / Casual">🍕 Fast / Casual</option>
          <option value="🍸 Bar / Drinks">🍸 Bar / Drinks</option>
          <option value="🌸 Other">🌸 Other</option>
        </select>
        <select id="sort-by">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="rating">Highest rated</option>
        </select>
      </div>

      <p class="count-line" id="count-line"></p>
      <div id="records" class="records-grid"></div>
      <div id="empty-state" class="empty-state hidden">
        <p class="big-emoji">🍽️💕</p>
        <p>No memories yet! Tap the <b>＋</b> button up top to add your first one.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    made with ♡ and delicious memories
  </footer>

  <!-- ============ ADD / EDIT MODAL ============ -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal paper-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" id="close-modal" class="close-x" aria-label="Close">✕</button>
      <h2 class="handwrite" id="modal-title">Where did we go? 🍴</h2>

      <form id="record-form">
        <div class="field">
          <label for="place">Place name</label>
          <input type="text" id="place" name="place" placeholder="e.g. Sunny Corner Café" required />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="type">Type</label>
            <select id="type" name="type">
              <option value="🍽️ Restaurant">🍽️ Restaurant</option>
              <option value="☕ Café">☕ Café</option>
              <option value="🧁 Dessert shop">🧁 Dessert shop</option>
              <option value="🍕 Fast / Casual">🍕 Fast / Casual</option>
              <option value="🍸 Bar / Drinks">🍸 Bar / Drinks</option>
              <option value="🌸 Other">🌸 Other</option>
            </select>
          </div>
          <div class="field">
            <label for="date">Date we went</label>
            <input type="date" id="date" name="date" />
          </div>
        </div>

        <div class="field">
          <label for="cuisine">Cuisine <span class="label-note">(optional)</span></label>
          <input type="text" id="cuisine" name="cuisine" placeholder="e.g. Thai, Italian, Japanese..." />
        </div>

        <!-- Location + map -->
        <div class="field">
          <label for="location-search">Location 📍</label>
          <div class="loc-search-row">
            <input type="text" id="location-search" placeholder="type a postcode, area or place, then Search" />
            <button type="button" id="loc-search-btn" class="mini-btn solid">Search</button>
          </div>
          <div id="loc-results" class="loc-results hidden"></div>
          <div id="map" class="map-box"></div>
          <p id="loc-chosen" class="loc-chosen"></p>
          <p class="loc-hint">Tip: you can also click directly on the map to drop a pin.</p>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Price</label>
            <div class="price-row">
              <div class="price-amount">
                <select id="currency" aria-label="currency">
                  <option value="£">£</option>
                  <option value="¥">¥ RMB</option>
                  <option value="$">$</option>
                  <option value="€">€</option>
                </select>
                <input type="text" id="price" name="price" inputmode="decimal" placeholder="amount" />
              </div>
              <div class="price-people">
                <input type="number" id="people" name="people" min="1" step="1" placeholder="no." />
                <span class="price-people-label">people</span>
              </div>
            </div>
          </div>
          <div class="field">
            <label>Our overall rating</label>
            <div class="stars" id="stars" role="radiogroup" aria-label="overall rating">
              <span class="star" data-value="1">★</span>
              <span class="star" data-value="2">★</span>
              <span class="star" data-value="3">★</span>
              <span class="star" data-value="4">★</span>
              <span class="star" data-value="5">★</span>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="photo">Photos of the moment 📸 <span class="label-note">(add as many as you like)</span></label>
          <input type="file" id="photo" name="photo" accept="image/*" multiple />
          <div id="photo-preview" class="photo-grid"></div>
        </div>

        <!-- Dishes: repeatable, each with comment + rating -->
        <div class="field">
          <label>Dishes we tried 🍴</label>
          <div id="dishes-list" class="dishes-list"></div>
          <button type="button" id="add-dish" class="add-dish-btn">＋ add another dish</button>
        </div>

        <div class="field">
          <label for="comments">Little notes & memories 💌</label>
          <textarea id="comments" name="comments" rows="3" placeholder="anything we want to remember about today..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="primary-btn" id="submit-btn">💗 Save this memory</button>
          <button type="button" class="ghost-btn" id="cancel-edit">cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- template for a single dish row -->
  <template id="dish-template">
    <div class="dish-row">
      <div class="dish-top">
        <input type="text" class="dish-name" placeholder="dish name (e.g. truffle pasta)" />
        <button type="button" class="dish-remove" aria-label="remove dish">🗑️</button>
      </div>
      <div class="dish-stars" role="radiogroup" aria-label="dish rating">
        <span class="dstar" data-value="1">★</span>
        <span class="dstar" data-value="2">★</span>
        <span class="dstar" data-value="3">★</span>
        <span class="dstar" data-value="4">★</span>
        <span class="dstar" data-value="5">★</span>
      </div>
      <input type="text" class="dish-comment" placeholder="how was it? (e.g. creamy & dreamy)" />
    </div>
  </template>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
